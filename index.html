<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 랜덤 주제</title>
<!--
  이 파일 하나가 이 웹앱의 전부예요. 레시피북 한 권이라고 생각하면 돼요.
  위에서부터 순서대로 3개 코너로 나뉘어 있어요.
    ① <style> 코너   = 화면이 "어떻게 생겼는지" (색깔·크기·배치 같은 옷차림)
    ② <body>  코너   = 화면에 "실제로 뭐가 있는지" (제목, 카드, 버튼 같은 뼈대)
    ③ <script> 코너  = "버튼을 누르면 무슨 일이 일어나는지" (움직이는 규칙)
  단어(행동/주체)만 바꾸고 싶다면 ③ 코너 맨 위, "단어 서랍" 부분만 찾아가면 돼요.
-->
<style>
  /* 여기부터 이 스타일 블록이 끝나는 곳까지는 전부 '디자인 옷장' 코너예요. 글자 크기, 색깔, 여백처럼
     눈에 보이는 스타일만 정하고, 실제 동작(로직)은 하나도 들어있지 않아요. */
  :root {
    /* 자주 쓰는 색깔들을 별명으로 미리 정해두는 곳이에요.
       예를 들어 --bg 색을 바꾸면, 이 색을 쓰는 화면 전체 배경이 한 번에 바뀌어요. */
    --bg: #16161a;
    --card-fg: #16161a;
    --panel: #232329;
    --text: #f4f4f5;
    --muted: #9a9aa5;
    --accent: #ff2e63;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", -apple-system, sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
    min-height: 100vh;
  }

  .app {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  h1 {
    font-size: 18px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.02em;
  }

  /* 상단의 알약 모양 "고정 / 자유" 스위치 껍데기 */
  .mode-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    padding: 4px;
    border-radius: 999px;
  }

  .mode-toggle button {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }

  .mode-toggle button.active {
    background: var(--accent);
    color: #fff;
  }

  /* 화면 한가운데 큰 색깔 카드 (뽑힌 "행동 + 주체"가 표시되는 곳) */
  .card {
    position: relative;
    border-radius: 28px;
    padding: 56px 24px;
    min-height: 320px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 12px;
    overflow: hidden;
    transition: background .25s ease;
    box-shadow: 0 20px 50px -20px rgba(0,0,0,0.6);
  }

  .card .date-badge {
    position: absolute;
    top: 18px;
    left: 20px;
    font-size: 12px;
    font-weight: 700;
    color: rgba(0,0,0,0.55);
    background: rgba(255,255,255,0.35);
    padding: 4px 10px;
    border-radius: 999px;
  }

  .card .action-text {
    font-size: 34px;
    font-weight: 800;
    color: var(--card-fg);
    line-height: 1.25;
    word-break: keep-all;
  }

  .card .subject-text {
    font-size: 40px;
    font-weight: 900;
    color: var(--card-fg);
    line-height: 1.2;
    word-break: keep-all;
  }

  /* 카드 아래 버튼들을 세로로 쌓아두는 상자 */
  .actions-row {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* "다시 뽑기" 버튼 (자유 모드일 때만 화면에 보여요) */
  .reroll-btn {
    border: none;
    background: var(--panel);
    color: var(--text);
    font-size: 15px;
    font-weight: 700;
    padding: 16px;
    border-radius: 16px;
    cursor: pointer;
    transition: transform .1s ease, background .15s ease;
  }

  .reroll-btn:active {
    transform: scale(0.98);
  }

  .reroll-btn:hover {
    background: #2c2c34;
  }

  /* "그림 완료" 체크박스 줄 */
  .done-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--panel);
    padding: 14px 16px;
    border-radius: 16px;
    cursor: pointer;
    user-select: none;
  }

  .done-row input {
    width: 20px;
    height: 20px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .done-row span {
    font-size: 15px;
    font-weight: 700;
  }

  .done-row.done span {
    color: var(--accent);
  }

  /* "히스토리 보기" 글자 버튼 (누르면 아래 기록 목록이 펼쳐져요) */
  .history-toggle {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px;
  }

  .history-toggle:hover {
    color: var(--text);
  }

  /* 펼쳐졌을 때 보이는 기록 목록 상자 (평소엔 접혀서 안 보여요) */
  .history-list {
    display: none;
    flex-direction: column;
    gap: 8px;
    background: var(--panel);
    border-radius: 16px;
    padding: 12px;
    max-height: 280px;
    overflow-y: auto;
  }

  .history-list.open {
    display: flex;
  }

  .history-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 10px;
    background: rgba(255,255,255,0.03);
  }

  .history-item .h-date {
    font-size: 12px;
    color: var(--muted);
    min-width: 78px;
  }

  .history-item .h-combo {
    font-size: 13px;
    font-weight: 600;
    flex: 1;
  }

  .history-item .h-check {
    font-size: 16px;
  }

  .empty-history {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 12px;
  }
</style>
</head>
<body>
<!--
  여기부터 </body>까지는 '화면 뼈대' 코너예요. 실제 글자나 색깔은 아래 자바스크립트가
  달려가서 채워 넣어요 (id="..." 라고 적힌 이름표가 "여기에 내용 넣어줘"라는 자리 표시예요).
-->
<div class="app">
  <header>
    <h1>오늘의 랜덤 주제</h1>
    <!-- 고정/자유 모드 스위치. 눌린 쪽 버튼에 색이 칠해져요 -->
    <div class="mode-toggle">
      <button id="fixedBtn" type="button">고정</button>
      <button id="freeBtn" type="button">자유</button>
    </div>
  </header>

  <!-- 뽑기 결과가 표시되는 큰 카드. 안의 글자와 배경색은 자바스크립트가 채워요 -->
  <div class="card" id="card">
    <div class="date-badge" id="dateBadge"></div>
    <div class="action-text" id="actionText">-</div>
    <div class="subject-text" id="subjectText">-</div>
  </div>

  <div class="actions-row">
    <!-- 자유 모드에서만 보이는 "다시 뽑기" 버튼 -->
    <button class="reroll-btn" id="rerollBtn" type="button">다시 뽑기</button>
    <!-- 그림을 다 그렸을 때 체크하는 칸 -->
    <label class="done-row" id="doneRow">
      <input type="checkbox" id="doneCheckbox">
      <span id="doneLabel">그림 완료</span>
    </label>
  </div>

  <!-- 눌렀다 폈다 하는 지난 기록 목록 -->
  <button class="history-toggle" id="historyToggle" type="button">히스토리 보기 ▾</button>
  <div class="history-list" id="historyList"></div>
</div>

<script>
  /*
    여기부터 이 스크립트 블록이 끝나는 곳까지는 '동작 규칙' 코너예요. 버튼을 누르면 무슨 일이 일어나는지
    순서대로 정해둔 부분이에요. 자바스크립트를 몰라도 아래 두 가지 서랍(단어 목록)만은
    안전하게 고칠 수 있어요.
      - 큰따옴표(" ") 안의 글자만 원하는 단어로 바꾸기
      - 새 단어를 추가할 땐 콤마(,)로 구분해서 큰따옴표째로 한 줄 추가하기
      - 단어를 지울 땐 그 줄 전체(따옴표+콤마)를 지우기
    그 외의 코드(함수, 중괄호 { } 등)는 건드리지 않는 게 안전해요.
  */

  // ---- [단어 서랍 1] 행동 목록: 여기 있는 단어 중 하나가 매번 무작위로 뽑혀요 ----
  const actions = [
    "트월킹하는", "명상하는", "도망치는", "낚시하는", "기지개 켜는",
    "몰래 훔쳐보는", "넘어질 뻔한", "자랑하는", "눈을 질끈 감은", "잠꼬대하는",
    "헤드뱅잉하는", "졸고있는", "삐친", "손으로 눈을 가린", "물구나무서는",
    "까치발로 서있는", "딸꾹질하는", "머리를 긁적이는", "발레하는", "탭댄스를 추는",
    "공중제비를 도는", "술에 취해 비틀거리는", "몸을 옆으로 기울인", "손가락을 튕기는", "코를 후비는",
    "어깨춤을 추다 어깨가 빠진", "휘파람 부는", "무언가를 먹고있는", "이불킥하는", "담배피는"
  ];

  // ---- [단어 서랍 2] 주체 목록: 행동과 짝지어질 대상들이에요 ----
  const subjects = [
    "양", "문어", "가로등", "선인장", "택배상자",
    "유령", "빗자루", "기린", "물고기", "고구마",
    "고슴도치", "와인잔", "포크", "고양이", "강아지",
    "깨진 이빨", "열쇠", "타조", "두더지", "로보트",
    "코끼리", "판다", "허수아비", "도너츠", "슬라임",
    "딸기", "벌꿀오소리", "스테이크", "장갑", "연필"
  ];

  // ---- [색깔 서랍] 카드 배경으로 쓸 쨍한 포인트 컬러들이에요.
  // #으로 시작하는 6자리 코드가 색깔 하나예요. 이 목록에 있는 색 중 하나가
  // "행동+주체" 조합마다 자동으로 골라져서 카드 배경에 칠해져요. ----
  const palette = [
    "#FFD400", "#FF2E63", "#00E5A0", "#00C2FF", "#FF6B00",
    "#B967FF", "#FF3E9A", "#7CFF6B", "#FFEA00", "#00FFD1"
  ];

  // 브라우저(크롬 등)의 "기억 창고"에 저장할 때 붙이는 이름표예요.
  // 사물함에 이름표를 붙여두는 것과 같아서, 이 이름으로 나중에 다시 꺼내볼 수 있어요.
  const STORAGE_HISTORY = "rwl_history"; // 지금까지의 뽑기 기록을 저장하는 이름표
  const STORAGE_MODE = "rwl_mode";       // 마지막으로 골랐던 모드(고정/자유)를 저장하는 이름표

  // 지금 이 순간의 상태를 기억해두는 변수들이에요 (페이지를 새로고침하면 초기화돼요)
  let mode = localStorage.getItem(STORAGE_MODE) || "fixed"; // 지금 모드: "fixed"(고정) 또는 "free"(자유)
  let currentCombo = null; // 지금 화면에 보이는 조합 { action: "행동", subject: "주체" }
  let currentDone = false; // 지금 조합이 "그림 완료" 체크됐는지 여부

  // 오늘 날짜를 "2026-09-12" 같은 도장 모양 글자로 만들어주는 역할이에요.
  // 고정 모드에서 "오늘 이미 뽑았는지" 확인할 때 이 도장을 기준으로 삼아요.
  function todayStr() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  // 브라우저의 "기억 창고"에서 지금까지 쌓인 기록을 통째로 꺼내오는 역할이에요.
  // 저장된 게 하나도 없으면 빈 목록([])을 대신 돌려줘요.
  function getHistory() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_HISTORY)) || [];
    } catch (e) {
      return [];
    }
  }

  // 기록 목록을 통째로 "기억 창고"에 다시 넣어두는(저장하는) 역할이에요.
  function saveHistory(arr) {
    localStorage.setItem(STORAGE_HISTORY, JSON.stringify(arr));
  }

  // 저장된 기록들 중에서 "오늘 날짜"로 된 기록이 이미 있는지 찾아주는 역할이에요.
  // (고정 모드에서 "오늘은 이미 뽑았나?"를 확인할 때 사용해요)
  function getTodayEntry() {
    return getHistory().find(e => e.date === todayStr());
  }

  // 오늘 기록을 새로 만들거나(없으면), 이미 있으면 내용을 덮어써서 저장하는 역할이에요.
  function upsertToday(combo, done) {
    const history = getHistory();
    const date = todayStr();
    const comboText = `${combo.action} ${combo.subject}`;
    const idx = history.findIndex(e => e.date === date);
    if (idx >= 0) {
      history[idx].combo = comboText;
      history[idx].done = done;
    } else {
      history.unshift({ date, combo: comboText, done });
    }
    saveHistory(history);
  }

  // 이 앱의 핵심 "뽑기" 역할이에요. 행동 서랍에서 하나, 주체 서랍에서 하나를
  // 각각 무작위로 뽑아서 한 쌍으로 묶어줘요. (제비뽑기 통 두 개에서 하나씩 뽑는 것과 같아요)
  function randomCombo() {
    const action = actions[Math.floor(Math.random() * actions.length)];
    const subject = subjects[Math.floor(Math.random() * subjects.length)];
    return { action, subject };
  }

  // 글자를 숫자로 바꿔주는 계산기예요. 겉보기엔 복잡해 보이지만, 목적은 딱 하나:
  // "같은 조합 글자는 항상 같은 숫자가 나오게" 만드는 거예요.
  function hashStr(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) {
      h = (h * 31 + str.charCodeAt(i)) >>> 0;
    }
    return h;
  }

  // 위에서 만든 숫자를 이용해서 "색깔 서랍(palette)" 중 몇 번째 색을 쓸지 정해요.
  // 그래서 같은 "행동+주체" 조합은 오늘 다시 봐도 항상 같은 배경색으로 보여요.
  function colorForCombo(combo) {
    const key = `${combo.action} ${combo.subject}`;
    const idx = hashStr(key) % palette.length;
    return palette[idx];
  }

  // 저장돼 있던 "행동 주체" 한 줄짜리 글자를 다시 { action, subject } 두 조각으로
  // 나눠주는 역할이에요. (예: "트월킹하는 벌꿀오소리" → 행동 "트월킹하는" + 주체 "벌꿀오소리")
  function parseCombo(comboText) {
    const parts = comboText.split(" ");
    const subject = parts[parts.length - 1];
    const action = parts.slice(0, -1).join(" ");
    return { action, subject };
  }

  // ---- 렌더링 코너: "지금 기억하고 있는 상태"를 실제 화면에 그려서 보여주는 함수들이에요.
  // (데이터를 바꾸는 함수와, 그 데이터를 화면에 "그려 보여주는" 함수를 나눠뒀어요) ----

  // 지금 뽑힌 조합(currentCombo)을 카드 배경색·글자·날짜에 실제로 반영하는 역할이에요.
  function renderCard() {
    const card = document.getElementById("card");
    const actionText = document.getElementById("actionText");
    const subjectText = document.getElementById("subjectText");
    const dateBadge = document.getElementById("dateBadge");

    card.style.background = colorForCombo(currentCombo);
    actionText.textContent = currentCombo.action;
    subjectText.textContent = currentCombo.subject;
    dateBadge.textContent = todayStr();

    const doneCheckbox = document.getElementById("doneCheckbox");
    const doneRow = document.getElementById("doneRow");
    doneCheckbox.checked = currentDone;
    doneRow.classList.toggle("done", currentDone);
  }

  // 지금 모드(고정/자유)에 맞게 상단 스위치 버튼 색을 칠하고,
  // 자유 모드일 때만 "다시 뽑기" 버튼이 보이도록 켜고 꺼주는 역할이에요.
  function renderMode() {
    document.getElementById("fixedBtn").classList.toggle("active", mode === "fixed");
    document.getElementById("freeBtn").classList.toggle("active", mode === "free");
    document.getElementById("rerollBtn").style.display = mode === "free" ? "block" : "none";
  }

  // 저장된 기록들을 목록 형태(날짜 + 조합 + 완료 체크 표시)로 화면에 그려주는 역할이에요.
  function renderHistory() {
    const list = document.getElementById("historyList");
    const history = getHistory();
    if (history.length === 0) {
      list.innerHTML = '<div class="empty-history">아직 기록이 없어요</div>';
      return;
    }
    list.innerHTML = history.map(e => `
      <div class="history-item">
        <span class="h-date">${e.date}</span>
        <span class="h-combo">${e.combo}</span>
        <span class="h-check">${e.done ? "✅" : "⬜"}</span>
      </div>
    `).join("");
  }

  // ---- 모드별 시작 방법 코너 ----

  // 고정 모드로 시작할 때 할 일: 오늘 이미 뽑은 기록이 있으면 그걸 그대로 보여주고,
  // 없으면 새로 하나 뽑아서 오늘 기록으로 저장해둬요. (하루 종일 같은 조합 유지)
  function initFixedMode() {
    const entry = getTodayEntry();
    if (entry) {
      currentCombo = parseCombo(entry.combo);
      currentDone = !!entry.done;
    } else {
      currentCombo = randomCombo();
      currentDone = false;
      upsertToday(currentCombo, currentDone);
    }
  }

  // 자유 모드로 시작할 때 할 일: 그냥 매번 새로 하나 무작위로 뽑아요.
  // (아직 "그림 완료" 체크를 안 했으니 저장은 나중에, 체크할 때만 해요)
  function initFreeMode() {
    currentCombo = randomCombo();
    currentDone = false;
  }

  // 상단 "고정/자유" 스위치를 눌렀을 때 실행되는 역할이에요.
  // 모드를 바꾸고, 그 모드에 맞게 다시 시작한 뒤, 화면을 전부 새로 그려요.
  function switchMode(newMode) {
    mode = newMode;
    localStorage.setItem(STORAGE_MODE, mode);
    if (mode === "fixed") {
      initFixedMode();
    } else {
      initFreeMode();
    }
    renderMode();
    renderCard();
    renderHistory();
  }

  // "다시 뽑기" 버튼을 눌렀을 때 실행돼요. 자유 모드일 때만 동작하고,
  // 고정 모드에서는 아무 일도 하지 않아요 (버튼 자체가 안 보이니 평소엔 호출될 일도 없어요).
  function reroll() {
    if (mode !== "free") return;
    currentCombo = randomCombo();
    currentDone = false;
    renderCard();
  }

  // "그림 완료" 체크박스를 눌렀을 때 실행돼요. 체크 상태를 뒤집고,
  // 오늘 기록에 지금 조합과 완료 여부를 저장한 뒤 화면을 다시 그려요.
  function toggleDone() {
    currentDone = !currentDone;
    upsertToday(currentCombo, currentDone);
    renderCard();
    renderHistory();
  }

  // ---- 연결 코너: "어떤 버튼을 누르면 위에서 만든 어떤 함수(로봇)를 부를지" 정해두는 곳이에요 ----
  document.getElementById("fixedBtn").addEventListener("click", () => switchMode("fixed"));
  document.getElementById("freeBtn").addEventListener("click", () => switchMode("free"));
  document.getElementById("rerollBtn").addEventListener("click", reroll);
  document.getElementById("doneRow").addEventListener("click", (e) => {
    e.preventDefault();
    toggleDone();
  });
  document.getElementById("historyToggle").addEventListener("click", () => {
    const list = document.getElementById("historyList");
    const open = list.classList.toggle("open");
    document.getElementById("historyToggle").textContent = open ? "히스토리 숨기기 ▴" : "히스토리 보기 ▾";
  });

  // ---- 초기화: 이 페이지를 처음 열었을 때 (또는 새로고침했을 때) 자동으로 실행되는 부분이에요 ----
  if (mode === "fixed") {
    initFixedMode();
  } else {
    initFreeMode();
  }
  renderMode();
  renderCard();
  renderHistory();
</script>
</body>
</html>
